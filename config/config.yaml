app:
  name: "Stock Trend Predictor"
  version: "2.2.0"
  host: "127.0.0.1"
  port: 5000

data:
  provider: "Yahoo Finance (yfinance)"
  default_ticker: "RELIANCE.NS"
  default_period: "5y"            # 2y | 5y | 10y | max
  cache_dir: ".cache"
  data_cache_ttl_minutes: 60      # re-download if cached data is older than this
  min_rows: 300                   # minimum clean daily bars required
  stale_after_days: 10            # warn if last bar is older than this

modeling:
  horizon: 21                     # trading sessions ahead (~1 month)
  eval_horizons: [1, 5, 10, 21]
  seq_len: 20                     # LSTM look-back window (sessions)
  split: {train: 0.70, val: 0.15} # remainder = test (chronological)
  interval_quantiles: [0.10, 0.90]  # 80% empirical interval
  random_state: 42
  models: [ridge, random_forest, gradient_boosting, xgboost, lstm, gru, transformer]
  use_market_context: true       # Nifty/Sensex/VIX/USDINR/crude/sector (UI checkbox overrides)
  tune: false                    # hyper-parameter search (UI checkbox overrides)
  lstm:
    hidden: 32
    epochs: 60
    patience: 8
    batch_size: 32
    lr: 0.003
    weight_decay: 0.0001
    n_seeds: 3
    backend: "auto"               # auto | torch | numpy

backtest:
  transaction_cost: 0.001         # 0.1% per position change

market_context:
  india:
    - {symbol: "^NSEI",     name: "Nifty 50",  lag: 0}
    - {symbol: "^BSESN",    name: "Sensex",    lag: 0}
    - {symbol: "^INDIAVIX", name: "India VIX", lag: 0}
    - {symbol: "INR=X",     name: "USD/INR",   lag: 1}
    - {symbol: "CL=F",      name: "Crude oil", lag: 1}
  us:
    - {symbol: "^GSPC", name: "S&P 500",   lag: 0}
    - {symbol: "^VIX",  name: "VIX",       lag: 0}
    - {symbol: "CL=F",  name: "Crude oil", lag: 0}
    - {symbol: "^TNX",  name: "US 10Y yield", lag: 0}
  other:
    - {symbol: "^GSPC", name: "S&P 500",   lag: 1}
    - {symbol: "^VIX",  name: "VIX",       lag: 1}
    - {symbol: "CL=F",  name: "Crude oil", lag: 1}

live:
  poll_seconds: 5                 # browser asks for a fresh price this often
  min_quote_interval_seconds: 4   # server never calls Yahoo more often than this per symbol (shared by all tabs)
  tail_rows: 300                  # completed daily bars kept in memory for incremental feature updates
  tail_refresh_seconds: 600       # how often the daily-bar tail is topped up (no retraining)
  test_fraction: 0.20             # chronological 80/20 split for the quick model
  max_quote_age_minutes: 20       # older quotes are flagged as stale / market closed
